name: iOS Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  FLUTTER_VERSION: "3.41.9"
  PROJECT_DIR: apps/flutter_cpemanager

jobs:
  build-ios:
    name: Build iOS IPA (for TrollStore)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ${{ env.PROJECT_DIR }}/ios
        run: pod install --repo-update

      - name: Disable iOS code signing for CI
        working-directory: ${{ env.PROJECT_DIR }}/ios
        run: |
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' Runner.xcodeproj/project.pbxproj
          grep -E 'CODE_SIGN_STYLE|CODE_SIGN_IDENTITY' Runner.xcodeproj/project.pbxproj | head -10

      - name: Build iOS with xcodebuild (no codesign)
        working-directory: ${{ env.PROJECT_DIR }}/ios
        env:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
        run: |
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath ../build/ios/Runner.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Package IPA (for TrollStore)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -rf build/ios/iphoneos/Payload
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/Runner.xcarchive/Products/Applications/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r CPEManager.ipa Payload/
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPEManager-iOS-${{ github.ref_name || 'dev' }}
          path: ${{ env.PROJECT_DIR }}/build/ios/iphoneos/CPEManager.ipa
